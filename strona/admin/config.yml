# Panel edycji treści strony Kancelarii KJK: https://kjk-kancelaria.netlify.app/admin/
# Decap CMS (https://decapcms.org) + logowanie DecapBridge (https://decapbridge.com).
# Pola odpowiadają plikom tresci/*.json; strona buduje się z nich po każdej zmianie (narzedzia/build.py).
# Plik tworzy skrypt narzedzia/panel_config.py – zmieniaj pola tam i wygeneruj plik ponownie.

backend:
  name: "git-gateway"
  repo: "kyukadesign/Kasia-Jurewicz"
  branch: "main"
  auth_type: "pkce"
  base_url: "https://auth.decapbridge.com"
  auth_endpoint: "/sites/3c875636-2ac9-498e-86ec-e30fd8485af1/pkce"
  auth_token_endpoint: "/sites/3c875636-2ac9-498e-86ec-e30fd8485af1/token"
  gateway_url: "https://gateway.decapbridge.com"
  commit_messages:
    create: "Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    update: "Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    delete: "Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    uploadMedia: "Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    deleteMedia: "Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge"
    openAuthoring: "Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge"
auth:
  email_claim: "email"
  first_name_claim: "first_name"
  last_name_claim: "last_name"
  avatar_url_claim: "avatar_url"
locale: "pl"
site_url: "https://kjk-kancelaria.netlify.app"
display_url: "https://kjk-kancelaria.netlify.app"
logo_url: "/img/apple-touch-icon.png"
media_folder: "strona/img/wgrane"
public_folder: "/img/wgrane"
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"
collections:
  - name: "strony"
    label: "Strony"
    label_singular: "strona"
    description: "Teksty stron. Po kliknięciu „Opublikuj” → „Opublikuj teraz” zmiana jest na stronie po 1–2 minutach. Słowo w gwiazdkach (*słowo*) będzie kursywą, w podwójnych (**słowo**) – pogrubione."
    editor:
      preview: false
    files:
      - name: "strona-glowna"
        label: "Strona główna"
        file: "tresci/strona-glowna.json"
        preview_path: ""
        fields:
          - label: "Cytat na pierwszym ekranie"
            name: "cytat"
            widget: "text"
            hint: "Bez cudzysłowu – strona dodaje go sama. Słowo w gwiazdkach (*słowo*) będzie kursywą, w podwójnych (**słowo**) – pogrubione."
          - label: "Zdanie pod cytatem"
            name: "zdanie"
            widget: "text"
            hint: "Komu i w czym pomagam."
          - label: "Podpis pod zdjęciem"
            name: "podpis_zdjecia"
            widget: "string"
          - label: "„W czym mogę pomóc” – opis"
            name: "specjalizacje_opis"
            widget: "text"
          - label: "„O mnie” – zdanie"
            name: "o_mnie_zdanie"
            widget: "text"
          - label: "„O mnie” – fakty"
            name: "o_mnie_fakty"
            widget: "list"
            summary: "{{fields.tytul}}"
            collapsed: false
            fields:
              - label: "Tytuł"
                name: "tytul"
                widget: "string"
              - label: "Opis"
                name: "opis"
                widget: "text"
            label_singular: "fakt"
            min: 1
            max: 6
            hint: "Najlepiej 4 – układają się w dwie kolumny."
          - label: "„Jak zaczynamy współpracę” – opis"
            name: "wspolpraca_opis"
            widget: "text"
            hint: "Link „Zasady wynagradzania” strona dodaje sama."
          - label: "„Jak zaczynamy współpracę” – kroki"
            name: "wspolpraca_kroki"
            widget: "list"
            summary: "{{fields.tytul}}"
            collapsed: false
            fields:
              - label: "Tytuł"
                name: "tytul"
                widget: "string"
              - label: "Opis"
                name: "opis"
                widget: "text"
            label_singular: "krok"
            min: 1
            max: 6
            hint: "Najlepiej 4. Te same kroki są też na stronie Specjalizacje."
          - label: "„Kontakt” – zdanie na dole strony"
            name: "kontakt_zdanie"
            widget: "text"
      - name: "o-mnie"
        label: "O mnie"
        file: "tresci/o-mnie.json"
        preview_path: "o-mnie.html"
        fields:
          - label: "Wstęp (duża czcionka)"
            name: "wstep"
            widget: "text"
          - label: "Podpis pod zdjęciem"
            name: "podpis_zdjecia"
            widget: "string"
          - label: "Części tekstu"
            name: "sekcje"
            widget: "list"
            summary: "{{fields.tytul}}"
            collapsed: false
            fields:
              - label: "Tytuł części"
                name: "tytul"
                widget: "string"
              - label: "Treść"
                name: "tresc"
                widget: "text"
                hint: "Każdy wiersz to osobny akapit."
            label_singular: "część"
          - label: "Zdanie na zakończenie"
            name: "zakonczenie"
            widget: "text"
            required: false
          - label: "Poza kancelarią"
            name: "poza_kancelaria"
            widget: "string"
            required: false
      - name: "strona-specjalizacje"
        label: "Specjalizacje – wstęp nad listą"
        file: "tresci/strona-specjalizacje.json"
        preview_path: "specjalizacje.html"
        fields:
          - label: "Wstęp"
            name: "wstep"
            widget: "text"
      - name: "zasady-wynagradzania"
        label: "Zasady wynagradzania"
        file: "tresci/zasady-wynagradzania.json"
        preview_path: "zasady-wynagradzania.html"
        fields:
          - label: "Wstęp"
            name: "wstep"
            widget: "text"
          - label: "„Jak to ustalamy” – kroki"
            name: "kroki"
            widget: "list"
            summary: "{{fields.tytul}}"
            collapsed: false
            fields:
              - label: "Tytuł"
                name: "tytul"
                widget: "string"
              - label: "Opis"
                name: "opis"
                widget: "text"
            label_singular: "krok"
          - label: "Formy rozliczenia"
            name: "formy_rozliczenia"
            widget: "list"
            required: false
            label_singular: "forma"
            collapsed: false
            field:
              label: "Forma rozliczenia"
              name: "forma"
              widget: "string"
            hint: "Puste – lista nie pokazuje się na stronie."
          - label: "„Z czego składa się koszt sprawy”"
            name: "koszty"
            widget: "list"
            summary: "{{fields.nazwa}}"
            collapsed: false
            fields:
              - label: "Nazwa"
                name: "nazwa"
                widget: "string"
              - label: "Opis"
                name: "opis"
                widget: "text"
            label_singular: "pozycja"
          - label: "Inne wydatki (np. tłumaczenia, dojazdy)"
            name: "inne_wydatki"
            widget: "text"
            required: false
            hint: "Puste – pozycja nie pokazuje się na stronie."
      - name: "kontakt"
        label: "Kontakt"
        file: "tresci/kontakt.json"
        preview_path: "kontakt.html"
        fields:
          - label: "Wstęp"
            name: "wstep"
            widget: "text"
          - label: "„Co dzieje się po kontakcie”"
            name: "po_kontakcie"
            widget: "list"
            summary: "{{fields.tytul}}"
            collapsed: false
            fields:
              - label: "Tytuł"
                name: "tytul"
                widget: "string"
              - label: "Opis"
                name: "opis"
                widget: "text"
            label_singular: "krok"
          - label: "Pierwsza rozmowa"
            name: "pierwsza_rozmowa"
            widget: "text"
            required: false
            hint: "Np. forma (telefon, spotkanie, online), czas trwania, koszt. Puste – informacja nie pokazuje się na stronie."
          - label: "Zdanie nad formularzem"
            name: "formularz_wstep"
            widget: "string"
      - name: "polityka-prywatnosci"
        label: "Polityka prywatności"
        file: "tresci/polityka-prywatnosci.json"
        preview_path: "polityka-prywatnosci.html"
        fields:
          - label: "Treść polityki prywatności"
            name: "tresc"
            widget: "markdown"
            required: false
            buttons:
              - "bold"
              - "italic"
              - "link"
              - "heading-two"
              - "heading-three"
              - "bulleted-list"
              - "numbered-list"
              - "quote"
            editor_components: []
            modes:
              - "rich_text"
            hint: "Puste – na stronie zostaje informacja, że pełna treść zostanie opublikowana. Część „Jak działa ta strona” strona dodaje sama."
      - name: "ustawienia"
        label: "Dane kontaktowe i media"
        file: "tresci/ustawienia.json"
        preview_path: "kontakt.html"
        fields:
          - label: "Telefon"
            name: "telefon"
            widget: "string"
            required: false
            hint: "Np. +48 600 700 800 – na stronie będzie klikalny. Pokaże się na pierwszym ekranie, w kontakcie i w stopce."
          - label: "E-mail"
            name: "email"
            widget: "string"
            required: false
          - label: "Adres kancelarii"
            name: "adres"
            widget: "string"
            required: false
          - label: "Instagram – pełny adres profilu"
            name: "instagram"
            widget: "string"
            required: false
            hint: "Zaczyna się od https://. Puste – ikona się nie pokazuje."
          - label: "YouTube – pełny adres kanału"
            name: "youtube"
            widget: "string"
            required: false
            hint: "Zaczyna się od https://. Puste – ikona się nie pokazuje."
          - label: "Facebook – pełny adres"
            name: "facebook"
            widget: "string"
            required: false
          - label: "LinkedIn – pełny adres"
            name: "linkedin"
            widget: "string"
            required: false
          - label: "Filmy (strona Blog)"
            name: "filmy"
            widget: "list"
            summary: "{{fields.tytul}}"
            collapsed: false
            fields:
              - label: "Link do filmu na YouTube"
                name: "film"
                widget: "string"
                hint: "Skopiuj adres filmu z przeglądarki, np. https://www.youtube.com/watch?v=…"
              - label: "Tytuł"
                name: "tytul"
                widget: "string"
              - label: "Krótki opis"
                name: "opis"
                widget: "text"
                required: false
              - label: "Film ma napisy"
                name: "napisy"
                widget: "boolean"
                default: false
                required: false
              - label: "Transkrypcja"
                name: "transkrypcja"
                widget: "text"
                required: false
                hint: "Akapity oddziel pustym wierszem."
            required: false
            label_singular: "film"
