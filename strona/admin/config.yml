  - name: "blog"
    label: "Blog – artykuły"
    label_singular: "artykuł"
    description: "Artykuły są na stronie Blog, a trzy najnowsze także na stronie głównej. Pierwszy opublikowany artykuł włącza „Blog” w menu. Zaznacz „Szkic”, żeby zapisać tekst bez pokazywania go na stronie."
    folder: "tresci/blog"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    identifier_field: "tytul"
    summary: "{{tytul}}"
    sortable_fields:
      - "data"
      - "tytul"
    preview_path: "blog/{{slug}}.html"
    fields:
      - label: "Tytuł"
        name: "tytul"
        widget: "string"
      - label: "Data publikacji"
        name: "data"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
      - label: "Kategoria"
        name: "kategoria"
        widget: "select"
        options:
          - label: "Rodzina"
            value: "rodzina"
          - label: "Spadki"
            value: "spadki"
          - label: "Umowy"
            value: "umowy"
          - label: "Należności i upadłość"
            value: "naleznosci"
          - label: "Firma"
            value: "firma"
          - label: "Komunikacja elektroniczna"
            value: "komunikacja"
      - label: "Powiązana specjalizacja"
        name: "specjalizacja"
        widget: "select"
        options:
          - label: "Rozwody"
            value: "rozwody"
          - label: "Alimenty"
            value: "alimenty"
          - label: "Spadki"
            value: "spadki"
          - label: "Opiniowanie umów"
            value: "opiniowanie-umow"
          - label: "Windykacja"
            value: "windykacja"
          - label: "Obsługa podmiotów gospodarczych"
            value: "obsluga-firm"
          - label: "Reprezentacja wierzycieli w postępowaniach upadłościowych"
            value: "upadlosc-wierzyciele"
          - label: "Prawo komunikacji elektronicznej"
            value: "komunikacja-elektroniczna"
        hint: "Pod artykułem pojawi się link do tej specjalizacji i przycisk „Zapytaj o swoją sprawę”."
      - label: "Wstęp"
        name: "wstep"
        widget: "text"
        hint: "1–2 zdania: czego dotyczy artykuł i dla kogo jest. Pokazuje się też na liście artykułów."
      - label: "Treść"
